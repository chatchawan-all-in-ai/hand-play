<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Race</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1630; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  video { display: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; text-align: center; background: rgba(8, 18, 40, .72); }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 64px; margin: 0; }
  #overlay p { font-size: 22px; margin: 0; max-width: 680px; line-height: 1.5; }
  #overlay button { font-size: 30px; padding: 14px 44px; border: 0; border-radius: 999px; background: #ffd166; color: #222; cursor: pointer; font-weight: 700; }
  #overlay button:disabled { opacity: .5; }
  #msg { font-size: 18px; color: #bcd; min-height: 1.4em; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="overlay">
  <h1>🫧 แข่งจิ้มลูกโป่ง 🫧</h1>
  <p>เล่น 2 คน ยืนคนละฝั่งของจอ<br>ใช้ <b>ปลายนิ้ว</b> จิ้มลูกโป่งฝั่งตัวเองให้แตก<br>⭐ ลูกดาวได้ 3 คะแนน · ใครได้มากกว่าใน 60 วินาทีชนะ!</p>
  <button id="startBtn">เปิดกล้อง</button>
  <div id="msg"></div>
</div>

<script type="module">
// ---- settings --------------------------------------------------------------
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const ROUND_S = 60;
const TIPS = [4, 8, 12, 16, 20];          // every fingertip pops — easy for small hands
const PLAYERS = [
  { name: 'ฝั่งซ้าย', color: '#4cc9f0', score: 0 },
  { name: 'ฝั่งขวา', color: '#ff70a6', score: 0 },
];
const BUBBLE_COLORS = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff924c', '#52d1dc'];

const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), g = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- camera picture → screen ("cover" fit, mirrored like a mirror) ---------------
function toScreen(p) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return { x: W - (ox + p.x * vw * s), y: oy + p.y * vh * s };
}

// ---- sound: tiny synthesized pops, no files --------------------------------------
let actx = null;
function beep(freq, dur = 0.12, type = 'sine', vol = 0.25) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(v).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const popSound = () => beep(500 + Math.random() * 500, 0.12, 'triangle');
const starSound = () => { beep(880, 0.15); setTimeout(() => beep(1320, 0.2), 90); };

// ---- game state --------------------------------------------------------------------
const game = { phase: 'idle', t0: 0, countdownUntil: 0, bubbles: [], bursts: [], lastSpawn: [0, 0], tips: [] };

function spawn(side, t) {
  const half = W / 2, r = 38 + Math.random() * 26, star = Math.random() < 0.08;
  game.bubbles.push({
    side, star, r,
    x: side * half + r + Math.random() * (half - 2 * r),
    y: H + r,
    vy: -(70 + Math.random() * 60) * (H / 800),         // pixels per second, upward
    wob: Math.random() * Math.PI * 2,
    color: BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)],
    born: t,
  });
}

function startRound(t) {
  PLAYERS.forEach(p => (p.score = 0));
  game.bubbles = []; game.bursts = [];
  game.phase = 'countdown'; game.countdownUntil = t + 3000;
  $('overlay').classList.add('hidden');
}

// one tick of game logic; tips = fingertip points in screen pixels
function step(tips, t, dt) {
  game.tips = tips;
  if (game.phase === 'countdown' && t >= game.countdownUntil) { game.phase = 'play'; game.t0 = t; game.lastSpawn = [t, t]; }
  if (game.phase !== 'play') return;
  const elapsed = (t - game.t0) / 1000;
  if (elapsed >= ROUND_S) { endRound(); return; }
  const every = Math.max(450, 1100 - elapsed * 10);   // bubbles come a bit faster as time goes on
  for (const side of [0, 1]) if (t - game.lastSpawn[side] > every) { spawn(side, t); game.lastSpawn[side] = t; }
  for (const b of game.bubbles) { b.y += b.vy * dt; b.wob += dt * 2; }
  game.bubbles = game.bubbles.filter(b => b.y > -b.r);
  // pop: a fingertip inside a bubble on the same side as the fingertip
  for (const tip of tips) {
    const side = tip.x < W / 2 ? 0 : 1;
    for (const b of game.bubbles) {
      if (b.popped || b.side !== side) continue;
      const bx = b.x + Math.sin(b.wob) * 12;
      if (Math.hypot(tip.x - bx, tip.y - b.y) < b.r + 10) {
        b.popped = true;
        PLAYERS[side].score += b.star ? 3 : 1;
        game.bursts.push({ x: bx, y: b.y, color: b.star ? '#ffd166' : b.color, t, text: b.star ? '+3' : '+1' });
        b.star ? starSound() : popSound();
      }
    }
  }
  game.bubbles = game.bubbles.filter(b => !b.popped);
}

function endRound() {
  game.phase = 'over'; game.bubbles = [];
  const [a, b] = PLAYERS.map(p => p.score);
  const winner = a === b ? 'เสมอกัน! เก่งทั้งคู่ 🎉' : `${(a > b ? PLAYERS[0] : PLAYERS[1]).name} ชนะ! 🏆`;
  $('overlay').querySelector('h1').textContent = winner;
  $('overlay').querySelector('p').innerHTML = `ฝั่งซ้าย <b>${a}</b> คะแนน · ฝั่งขวา <b>${b}</b> คะแนน`;
  $('startBtn').textContent = 'เล่นอีกรอบ'; $('startBtn').disabled = false;
  $('overlay').classList.remove('hidden');
  beep(660, 0.2); setTimeout(() => beep(880, 0.2), 150); setTimeout(() => beep(1100, 0.35), 300);
}

// ---- drawing ------------------------------------------------------------------------
function draw(t) {
  g.save(); g.globalAlpha = 0.55;                      // camera, mirrored and dimmed
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(W / vw, H / vh);
  g.translate(W, 0); g.scale(-1, 1);
  if (video.readyState >= 2) g.drawImage(video, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
  g.restore();
  g.fillStyle = 'rgba(11,22,48,.35)'; g.fillRect(0, 0, W, H);

  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 4; g.setLineDash([14, 12]);   // middle line
  g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke(); g.setLineDash([]);

  for (const b of game.bubbles) {                     // bubbles
    const x = b.x + Math.sin(b.wob) * 12;
    const grad = g.createRadialGradient(x - b.r / 3, b.y - b.r / 3, b.r / 6, x, b.y, b.r);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.25, b.star ? '#ffe28a' : b.color); grad.addColorStop(1, b.star ? '#f4a300' : b.color);
    g.fillStyle = grad; g.globalAlpha = 0.9; g.beginPath(); g.arc(x, b.y, b.r, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    if (b.star) { g.font = `${b.r}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('⭐', x, b.y + 2); }
  }
  game.bursts = game.bursts.filter(p => t - p.t < 600);      // pop rings + "+1"
  for (const p of game.bursts) {
    const k = (t - p.t) / 600;
    g.strokeStyle = p.color; g.globalAlpha = 1 - k; g.lineWidth = 6;
    g.beginPath(); g.arc(p.x, p.y, 20 + k * 60, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 34px system-ui'; g.textAlign = 'center'; g.fillText(p.text, p.x, p.y - 30 - k * 40);
    g.globalAlpha = 1;
  }
  for (const tip of game.tips) {                      // fingertips
    g.fillStyle = tip.x < W / 2 ? PLAYERS[0].color : PLAYERS[1].color;
    g.beginPath(); g.arc(tip.x, tip.y, 10, 0, Math.PI * 2); g.fill();
  }
  // scores + timer
  g.textBaseline = 'top'; g.font = 'bold 56px system-ui';
  g.textAlign = 'left'; g.fillStyle = PLAYERS[0].color; g.fillText(`${PLAYERS[0].name} ${PLAYERS[0].score}`, 24, 18);
  g.textAlign = 'right'; g.fillStyle = PLAYERS[1].color; g.fillText(`${PLAYERS[1].score} ${PLAYERS[1].name}`, W - 24, 18);
  g.textAlign = 'center'; g.fillStyle = '#fff';
  if (game.phase === 'play') g.fillText(`⏱ ${Math.max(0, Math.ceil(ROUND_S - (t - game.t0) / 1000))}`, W / 2, 18);
  if (game.phase === 'countdown') {
    g.font = 'bold 200px system-ui'; g.textBaseline = 'middle';
    g.fillText(String(Math.ceil((game.countdownUntil - t) / 1000)), W / 2, H / 2);
  }
  g.textBaseline = 'alphabetic';
}

// ---- camera + loop ---------------------------------------------------------------------
let tracker = null, lastVT = -1, lastT = 0;
async function openCamera() {
  $('startBtn').disabled = true; $('msg').textContent = 'กำลังโหลด…';
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const vision = await import(`${MP}/vision_bundle.mjs`);
    const files = await vision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const make = delegate => vision.HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numHands: 4,
    });
    try { tracker = await make('GPU'); } catch { tracker = await make('CPU'); }
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' }, audio: false });
    await video.play();
    $('msg').textContent = '';
    $('startBtn').textContent = 'เริ่มเล่น!'; $('startBtn').disabled = false;
    $('startBtn').onclick = () => startRound(performance.now());
    requestAnimationFrame(loop);
  } catch (e) {
    $('msg').textContent = 'เปิดกล้องไม่ได้: ' + (e.message || e); $('startBtn').disabled = false;
  }
}
function loop(t) {
  if (W !== innerWidth || H !== innerHeight) resize();   // window resized / went fullscreen
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0; lastT = t;
  if (video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    const res = tracker.detectForVideo(video, t);
    game.tipsRaw = (res.landmarks || []).flatMap(L => TIPS.map(i => toScreen(L[i])));
  }
  step(game.tipsRaw || [], t, dt);
  draw(t);
  requestAnimationFrame(loop);
}
$('startBtn').onclick = openCamera;
addEventListener('keydown', e => { if (e.code === 'Space' && game.phase !== 'play' && game.phase !== 'countdown' && tracker) startRound(performance.now()); });
window.__game = { game, step, startRound, draw, PLAYERS, size: () => [W, H] };   // test hooks
</script>
</body>
</html>
